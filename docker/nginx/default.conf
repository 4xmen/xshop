server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # keep in sync with php.ini upload limits
    client_max_body_size 128M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel health check
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # never run PHP from public upload dirs (must come before the \.php$ block)
    location ~* ^/storage/.*\.(php[0-9]*|phtml|phar)$ {
        return 403;
    }
    location ~* ^/upload/.*\.(php[0-9]*|phtml|phar)$ {
        return 403;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # keep host:port so Laravel builds correct URLs on a mapped port
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # block dotfiles and sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ \.(env|git|lock)$ {
        deny all;
    }
}
